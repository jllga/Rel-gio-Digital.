<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1020;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .relogio {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
            background: #151d32;
            border: 1px solid #303b55;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .etiqueta {
            font-size: 0.9rem;
            color: #a5b4fc;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .hora {
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .periodo {
            color: #a5b4fc;
            font-size: 1rem;
            margin-top: 8px;
        }

        .data {
            margin-top: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            text-transform: capitalize;
        }

        .fuso {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }
    </style>
</head>

<body>
    <main class="relogio">
        <h1>Relógio Digital</h1>

        <p class="etiqueta">HORÁRIO ATUAL</p>

        <div class="hora" id="hora">00:00:00</div>
        <div class="periodo" id="periodo"></div>

        <div class="data" id="data">
            Carregando data...
        </div>

        <div class="fuso">Horário de Brasília</div>

        <button id="botaoFormato">
            Mudar para formato 12h
        </button>
    </main>

    <script>
        const elementoHora = document.getElementById("hora");
        const elementoPeriodo = document.getElementById("periodo");
        const elementoData = document.getElementById("data");
        const botaoFormato = document.getElementById("botaoFormato");

        let formato24Horas = true;

        function atualizarRelogio() {
            const agora = new Date();

            const opcoesHora = {
                timeZone: "America/Sao_Paulo",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: !formato24Horas
            };

            const horaFormatada = new Intl.DateTimeFormat(
                "pt-BR",
                opcoesHora
            ).format(agora);

            elementoHora.textContent = horaFormatada;

            if (formato24Horas) {
                elementoPeriodo.textContent = "";
            } else {
                const periodo = new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: true
                }).formatToParts(agora)
                  .find(parte => parte.type === "dayPeriod");

                elementoPeriodo.textContent = periodo
                    ? periodo.value.toUpperCase()
                    : "";
            }

            const opcoesData = {
                timeZone: "America/Sao_Paulo",
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            };

            elementoData.textContent = new Intl.DateTimeFormat(
                "pt-BR",
                opcoesData
            ).format(agora);
        }

        botaoFormato.addEventListener("click", function () {
            formato24Horas = !formato24Horas;

            botaoFormato.textContent = formato24Horas
                ? "Mudar para formato 12h"
                : "Mudar para formato 24h";

            atualizarRelogio();
        });

        atualizarRelogio();

        setInterval(atualizarRelogio, 1000);
    </script>
</body>
</html>
